name: QC Preflight Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Run QC Preflight Checks
    uses: test-sshedge-org/test-qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@cd6a44f6c991f7cbabbd07b4e18389e19b284d98
    with:
      enable-semgrep-scan: true
      enable-dependency-review: true
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: false
      enable-armor-checkers: true
    permissions:
      contents: read
      security-events: write
